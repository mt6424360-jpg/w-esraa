name: Esraa Wedding Invitation

on:
push:
branches: [“main”]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: “pages”
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20
  - name: Install dependencies
    working-directory: "Interactive Wedding Invitation Website"
    run: npm install
  - name: Build
    working-directory: "Interactive Wedding Invitation Website"
    run: npm run build -- --base=/w-esraa/
  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: "Interactive Wedding Invitation Website/dist"

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
needs: build
steps:
- name: Deploy to GitHub Pages
id: deployment
uses: actions/deploy-pages@v4
